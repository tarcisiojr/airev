  # Findings
  suggestion: "Sugestão:"

  # Categorias
  category_security: "segurança"
  category_performance: "performance"
  category_bug: "bug"
  category_resource_leak: "vazamento de recurso"
  category_text_quality: "qualidade de texto"

  # Resumo
  summary: "RESUMO:"
  findings_count: "{count} finding(s)"
  no_problems: "✓ Nenhum problema encontrado. Código aprovado!"
  raw_response: "Resposta raw da IA:"

  # Dependências
  dependencies: "DEPENDÊNCIAS"
  callers: "CALLERS"
  callees: "CALLEES"
  no_deps_found: "Sem dependências encontradas"
  no_findings_file: "✅ Sem findings neste arquivo"

